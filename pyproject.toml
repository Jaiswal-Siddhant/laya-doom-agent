[project]
name = "laya-doom"
version = "0.1.0"
description = "A V1 autonomous DOOM combat agent using ViZDoom structured state and Laya-MLX typed decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laya DOOM contributors" }]
dependencies = [
    "pydantic>=2.7",
    "laya-mlx>=0.1.0",
    "mlx>=0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "vizdoom>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
laya-doom = "laya_doom.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_doom"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true
warn_unused_ignores = true
exclude = ["runs/"]

[[tool.mypy.overrides]]
module = ["vizdoom", "laya_mlx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require an installed external runtime such as ViZDoom",
]
