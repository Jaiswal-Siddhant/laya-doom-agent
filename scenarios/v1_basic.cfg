# V1 structured-state combat scenario.
# Uses ViZDoom's bundled basic.wad. Keep this scenario outside Python so it can be
# tuned without changing agent code.

doom_scenario_path = basic.wad
doom_map = map01

episode_timeout = 700
episode_start_time = 10
living_reward = -1

screen_resolution = RES_320X240
screen_format = RGB24
render_hud = true
render_crosshair = true
render_weapon = true
render_decals = false
render_particles = false

labels_buffer_enabled = true

available_buttons =
{
    MOVE_FORWARD
    TURN_LEFT
    TURN_RIGHT
    ATTACK
}

available_game_variables =
{
    HEALTH
    ARMOR
    AMMO0
    SELECTED_WEAPON
    SELECTED_WEAPON_AMMO
    POSITION_X
    POSITION_Y
    ANGLE
}

mode = PLAYER
doom_skill = 1
